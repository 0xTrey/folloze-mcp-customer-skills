interface:
  display_name: "Folloze ROI Calculator Builder"
  short_description: "Build finance-defensible, source-branded ROI calculators for Folloze"
  default_prompt: "Use $folloze-roi-calculator-builder to interview the stakeholder, establish an evidence-backed ROI or value model, and produce the requested prompt, model, or self-contained calculator artifact. Run $abm-strategist for named-account or one-to-few work. Run $brand-harvester before every HTML build and require brand.json.validation.status to be ok. Keep local build, Folloze save, publish, anonymous verification, analytics verification, Git commit, and Git push as separate states."

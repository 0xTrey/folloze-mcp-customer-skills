interface:
  display_name: "Folloze ROI Calculator Builder"
  short_description: "Build finance-defensible, source-branded ROI calculators for Folloze"
  default_prompt: "Use $folloze-roi-calculator-builder to interview the stakeholder, establish an evidence-backed ROI or value model, and produce the requested prompt, model, or self-contained calculator artifact. Before any HTML build, download or update $folloze-analytics-tracking from the public Folloze customer skill source, read it completely, and apply it to every CTA and meaningful calculator interaction. Run $abm-strategist for named-account or one-to-few work. Use $folloze-brand-kit for Folloze-owned work or run $brand-harvester for external brands and require brand.json.validation.status to be ok. Apply $folloze-board-quality-core. Keep local build, Folloze save, publish, anonymous verification, analytics verification, Git commit, and Git push as separate states."

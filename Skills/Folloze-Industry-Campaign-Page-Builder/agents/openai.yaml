interface:
  display_name: "Folloze Industry Campaign Page"
  short_description: "Build vertical, segment, cohort, persona, and one-to-few Folloze campaign pages"
  default_prompt: "Use $abm-strategist for one-to-few or named clusters and consume its builder handoff. When build_mode is native_traditional, build one native Folloze board with native content and a board-scoped Custom Theme, then apply or verify exact-domain personalization in the Designer. Require generic fallback plus materially different logo, copy, content, and CTA views. Never substitute HTML for a native request. Run $brand-harvester and require brand.json.validation.status to be ok before theme or visual decisions."

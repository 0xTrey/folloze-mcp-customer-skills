  short_description: "Turn one content item into a source-branded standalone buyer experience"
  default_prompt: "Use $abm-strategist only when the content activation is named-account or one-to-few. Use $folloze-brand-kit for a Folloze-owned experience or $brand-harvester with brand.json.validation.status ok for an external brand. Then use $Folloze-Content-Magic-Builder with $folloze-board-quality-core before MCP save or publish. Inherit an upstream route handoff when one is supplied."
